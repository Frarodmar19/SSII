# PAI-2 BYODSEC - entorno reproducible (Rol C)
#
# Servicios:
#   ca-init   genera PKI (CA, cert de servidor, CRL) y los 300 usuarios; luego termina.
#   gateway   el gateway TLS 1.3 + mTLS (puertos 8443 enrolamiento, 9443 canal seguro).
#   sniffer   tcpdump compartiendo la pila de red del gateway: captura su interfaz real,
#             no loopback, para que las .pcap sean convincentes (RS4).
#   bench     cliente de carga; perfiles para 300 sesiones y para el escalado 50..500.
#   attacker  batería de ataques de admisión contra el túnel (extra +10%).
#
# Uso típico:
#   docker compose run --rm ca-init
#   docker compose up -d gateway sniffer
#   docker compose run --rm bench            # prueba de 300 sesiones
#   docker compose run --rm attacker         # batería de ataques (necesita el sniffer)
#   docker compose --profile plain up -d plain-server   # línea base en claro

name: pai2-byodsec

services:
  ca-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pai2-byodsec:latest
    volumes:
      - pki:/app/pki
      - db:/app/server
      - ./..//evidence:/app/evidence
    command: >
      bash -c "python -c 'from pki.ca import generate_ca; generate_ca(force=True)' &&
               python -c 'from pki.issue import issue_server_cert; issue_server_cert()' &&
               python -c 'from pki.crl import generate_crl; generate_crl([])' &&
               python -m seed.seed_users"

  gateway:
    image: pai2-byodsec:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pai2-gateway
    environment:
      GATEWAY_BIND: "0.0.0.0"
      GATEWAY_ENROLL_PORT: "8443"
      GATEWAY_PORT: "9443"
    ports:
      - "8443:8443"
      - "9443:9443"
    volumes:
      - pki:/app/pki
      - db:/app/server
      - ./../evidence:/app/evidence
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      ca-init:
        condition: service_completed_successfully

  sniffer:
    image: pai2-byodsec:latest
    # Comparte la pila de red del gateway: ve exactamente su tráfico (RS4).
    network_mode: "service:gateway"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./../evidence:/app/evidence
    entrypoint: ["bash", "docker/capture.sh"]
    depends_on:
      - gateway

  plain-server:
    image: pai2-byodsec:latest
    profiles: ["plain"]
    container_name: pai2-plain
    environment:
      PLAIN_PORT: "9080"
    ports:
      - "9080:9080"
    volumes:
      - pki:/app/pki
      - db:/app/server
    command: ["python", "-m", "bench.plain_server"]
    depends_on:
      ca-init:
        condition: service_completed_successfully

  bench:
    image: pai2-byodsec:latest
    environment:
      GATEWAY_HOST: "gateway"
    volumes:
      - pki:/app/pki
      - ./../evidence:/app/evidence
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: ["python", "-m", "bench.load_test", "--host", "gateway",
              "--mode", "tls", "--clients", "300", "--msgs", "20"]
    depends_on:
      - gateway

  attacker:
    image: pai2-byodsec:latest
    volumes:
      - pki:/app/pki
      - db:/app/server
      - ./../evidence:/app/evidence
    command: ["python", "-m", "attacks.run_attacks", "--host", "gateway",
              "--port", "9443", "--no-pcap"]
    depends_on:
      - gateway

volumes:
  pki:
  db:

services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: vulnaweb-dvwa
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: vulnaweb-juiceshop
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
